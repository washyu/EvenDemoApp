name: even_pomodoro
description: Pomodoro timer plugin for Even G1 glasses
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.even.pomodoro
        pluginClass: EvenPomodoroPlugin
      ios:
        pluginClass: EvenPomodoroPlugin